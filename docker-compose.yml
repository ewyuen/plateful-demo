# Runs the whole app on one machine: docker compose up --build
# Then open http://localhost:8080 (see "Run it" in README.md).
# Settings come from .env (copy .env.example). Only the proxy's port is published.

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,proxy,backend
    # Staff, admin and customer sign-in use a session cookie, and Django's CSRF check must trust the
    # address the browser uses (the proxy's port). One proxy sits in front of the backend, so the
    # rate limits read the client address from the last X-Forwarded-For entry.
    CSRF_TRUSTED_ORIGINS: http://localhost:${PROXY_PORT:-8080},http://127.0.0.1:${PROXY_PORT:-8080}
    NUM_PROXIES: "1"
    POSTGRES_DB: plateful
    POSTGRES_USER: plateful
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
    PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
    ASSISTANT_RATE: ${ASSISTANT_RATE:-20/min}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plateful
      POSTGRES_USER: plateful
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - plateful-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateful -d plateful"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once: create the tables and load the starter restaurants (safe to repeat).
  migrate:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py loaddata seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready/')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the page at build time: rebuild (up --build) after changing it.
        VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      - ./compose/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  plateful-db:
