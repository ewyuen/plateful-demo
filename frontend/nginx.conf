server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The page: always revalidate, so a new deploy is picked up on the next load.
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints these file names, so they never change under the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app has page addresses (/restaurants/3, /orders): anything that is not a built
    # file is answered with the app, which then shows the right page. Missing files under
    # /assets/ above stay a real 404.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
