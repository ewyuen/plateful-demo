apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: plateful
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      # Port 80 is what Ingress and other pods use; the unprivileged nginx image listens on 8080.
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: plateful
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Built on the host and loaded with `minikube image load`; the tag does not exist in any registry.
          image: plateful-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # nginx answers any Host header, so unlike the backend these probes need none.
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            # The image declares USER 101 (a number), so the kubelet can verify this.
            runAsNonRoot: true
