# Deletes unfinished checkout drafts (ADR-0011): a customer who started paying and never
# finished leaves one behind. Runs hourly and removes drafts older than 24 hours; orders are
# never touched. Same image, settings and database as the backend.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: purge-checkout-drafts
  namespace: plateful
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: purge-checkout-drafts
        spec:
          restartPolicy: Never
          containers:
            - name: purge
              image: plateful-backend:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "purge_checkout_drafts", "--older-than-hours", "24"]
              envFrom:
                - configMapRef:
                    name: plateful-config
                - secretRef:
                    name: plateful-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
