# What both deploy modes share (ADR-0017). Overlays set the host names, the image tag and registry,
# and the storage class. The Secret is not here: scripts/plateful creates it from .env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend-migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - purge-drafts-cronjob.yaml
  - ingress.yaml
