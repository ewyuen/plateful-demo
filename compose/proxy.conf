# The same split as k8s/ingress.yaml: /api, /admin and /static go to the backend, everything else to
# the frontend, so the browser sees one origin and CORS never applies. (/admin is the Django admin
# and /static its styles; without them the admin address would show the shop's page.)
server {
    listen 8080;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /admin {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
